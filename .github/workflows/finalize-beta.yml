name: Finalize partial beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing add-on beta SemVer
        required: true
        type: string
      manifest_digest:
        description: Existing immutable multi-arch digest
        required: true
        type: string
      source_commit:
        description: Original reviewed source commit
        required: true
        type: string
      source_run_id:
        description: Failed Publish beta workflow run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ftw-beta-publication
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/srcfl/home-assistant-addons/ftw

jobs:
  finalize:
    name: Verify and finalize existing beta
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - uses: docker/setup-buildx-action@v4
      - name: Require the reviewed main commit
        run: >-
          python scripts/release_gate.py source-prepare
          --ref "${GITHUB_REF}"
          --sha "${GITHUB_SHA}"
      - run: python scripts/validate.py --channel beta
      - id: gate
        name: Verify the failed run and immutable images
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.manifest_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_gate.py beta-resume-prepare
          --version "${VERSION}"
          --digest "${DIGEST}"
          --source-commit "${SOURCE_COMMIT}"
          --source-run-id "${SOURCE_RUN_ID}"
          --repository "${GITHUB_REPOSITORY}"
      - name: Download the original platform SBOMs
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: ftw-*-sbom
          merge-multiple: true
          path: ${{ runner.temp }}/beta-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Require both original platform SBOMs
        run: |
          test -f "${RUNNER_TEMP}/beta-evidence/ftw-amd64.spdx.json"
          test -f "${RUNNER_TEMP}/beta-evidence/ftw-aarch64.spdx.json"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the amd64 source index signature
        uses: home-assistant/builder/actions/cosign-verify@2026.06.0
        with:
          image: ${{ steps.gate.outputs.amd64_source_image }}@${{ steps.gate.outputs.amd64_source_digest }}
          cosign-identity: >-
            https://github.com/srcfl/home-assistant-addons/.github/workflows/release-beta.yml@refs/heads/main
          cosign-issuer: https://token.actions.githubusercontent.com
          allow-failure: false
      - name: Verify the aarch64 source index signature
        uses: home-assistant/builder/actions/cosign-verify@2026.06.0
        with:
          image: ${{ steps.gate.outputs.aarch64_source_image }}@${{ steps.gate.outputs.aarch64_source_digest }}
          cosign-identity: >-
            https://github.com/srcfl/home-assistant-addons/.github/workflows/release-beta.yml@refs/heads/main
          cosign-issuer: https://token.actions.githubusercontent.com
          allow-failure: false
      - name: Verify the multi-arch index signature
        uses: home-assistant/builder/actions/cosign-verify@2026.06.0
        with:
          image: ${{ env.IMAGE }}@${{ inputs.manifest_digest }}
          cosign-identity: >-
            https://github.com/srcfl/home-assistant-addons/.github/workflows/release-beta.yml@refs/heads/main
          cosign-issuer: https://token.actions.githubusercontent.com
          allow-failure: false
      - id: evidence
        name: Verify GitHub attestations and original SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          FINALIZER_COMMIT: ${{ github.sha }}
          DIGEST: ${{ inputs.manifest_digest }}
        run: >-
          python scripts/release_gate.py beta-resume-evidence
          --repository "${GITHUB_REPOSITORY}"
          --source-commit "${SOURCE_COMMIT}"
          --finalizer-commit "${FINALIZER_COMMIT}"
          --image "${IMAGE}"
          --digest "${DIGEST}"
          --amd64-image "${{ steps.gate.outputs.amd64_source_image }}"
          --amd64-digest "${{ steps.gate.outputs.amd64_source_digest }}"
          --amd64-sbom "${RUNNER_TEMP}/beta-evidence/ftw-amd64.spdx.json"
          --aarch64-image "${{ steps.gate.outputs.aarch64_source_image }}"
          --aarch64-digest "${{ steps.gate.outputs.aarch64_source_digest }}"
          --aarch64-sbom "${RUNNER_TEMP}/beta-evidence/ftw-aarch64.spdx.json"
          --index-sbom "${RUNNER_TEMP}/beta-evidence/ftw.spdx.json"
      - name: Create the exact release manifest
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.manifest_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          python scripts/release_gate.py beta-manifest
          --version "${VERSION}"
          --digest "${DIGEST}"
          --source-commit "${SOURCE_COMMIT}"
          --output "${RUNNER_TEMP}/beta-evidence/release-manifest.json"
      - name: Double-check immutable targets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.manifest_digest }}
        run: >-
          python scripts/release_gate.py beta-resume-recheck
          --version "${VERSION}"
          --digest "${DIGEST}"
          --repository "${GITHUB_REPOSITORY}"
      - name: Log in for the index attestation
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the missing index SBOM attestation
        if: steps.evidence.outputs.index_oci_attestation_exists != 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ inputs.manifest_digest }}
          sbom-path: ${{ runner.temp }}/beta-evidence/ftw.spdx.json
          push-to-registry: true
      - name: Verify the index SBOM from OCI
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_COMMIT: ${{ github.sha }}
          DIGEST: ${{ inputs.manifest_digest }}
        run: >-
          python scripts/release_gate.py beta-resume-verify-oci
          --repository "${GITHUB_REPOSITORY}"
          --source-commit "${{ inputs.source_commit }}"
          --finalizer-commit "${FINALIZER_COMMIT}"
          --image "${IMAGE}"
          --digest "${DIGEST}"
          --index-sbom "${RUNNER_TEMP}/beta-evidence/ftw.spdx.json"
      - name: Create the beta release at the original source commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          tag="ftw-v${VERSION}"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_COMMIT}" \
            --title "FTW add-on v${VERSION}" \
            --notes "Beta. Home Assistant OS and Supervisor qualification is still required before stable promotion." \
            --prerelease \
            --latest=false \
            "${RUNNER_TEMP}/beta-evidence/release-manifest.json" \
            "${RUNNER_TEMP}/beta-evidence/ftw-amd64.spdx.json" \
            "${RUNNER_TEMP}/beta-evidence/ftw-aarch64.spdx.json" \
            "${RUNNER_TEMP}/beta-evidence/ftw.spdx.json"
      - name: Verify the final tag, release, assets, and image aliases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.manifest_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          python scripts/release_gate.py beta-resume-final-state
          --version "${VERSION}"
          --digest "${DIGEST}"
          --source-commit "${SOURCE_COMMIT}"
          --repository "${GITHUB_REPOSITORY}"
          --evidence-dir "${RUNNER_TEMP}/beta-evidence"
