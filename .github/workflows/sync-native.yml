name: Pin new FTW 0.x release (ftw-0x-beta, ftw)

# Opens a pull request that moves an app to a newer FTW 0.x release after
# verifying ftw-native-release.json and the .sha256 files. A beta tag moves
# ftw-0x-beta; a stable tag moves the stable app `ftw` in ftw-0x, and its
# first stable pin lists that app in the store. It pushes no image, creates
# no tag or release: Supervisor builds the app on the device, so the pin PR
# merges automatically after Check passes on its exact commit.
# The retired 3.x ftw / ftw-beta apps and their workflows are untouched.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact v0.X.Y-beta.N or v0.X.Y stable, empty for the newest beta"
        required: false
        type: string
  repository_dispatch:
    types: [ftw-native-release]

permissions:
  contents: read

concurrency:
  group: ftw-native-pin
  cancel-in-progress: false

jobs:
  pin:
    if: github.repository == 'srcfl/home-assistant-addons'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify and move the pin
        id: pin
        env:
          INPUT_TAG: ${{ inputs.tag || github.event.client_payload.tag || '' }}
        run: |
          set -euo pipefail
          app=ftw-0x-beta
          if [[ "${INPUT_TAG}" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            app=ftw-0x
          elif [ -n "${INPUT_TAG}" ] && ! [[ "${INPUT_TAG}" =~ ^v0\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::not a 0.x beta or stable tag"; exit 1
          fi
          python scripts/native_pin.py bump ${INPUT_TAG:+"$INPUT_TAG"}
          tag="$(sed -n 's/^ARG FTW_VERSION=//p' "${app}/Dockerfile")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open the pin pull request
        id: pr
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          # The branch names the app; native_publish.py reads it back.
          if [[ "${TAG}" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then app=ftw-0x slug=ftw; else app=ftw-0x-beta slug=ftw-0x-beta; fi
          branch="bot/pin-${slug}-${TAG}"
          # Recover if a previous run pushed the branch but failed to open its PR.
          if ! git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "${branch}"
            # The stable app's first pin adds config.yaml and removes unlisted.yaml.
            git add -A -- "${app}"
            git commit -m "chore: pin ${slug} to FTW ${TAG}"
            git push origin "${branch}"
          fi
          state=$(gh pr list --head "${branch}" --state all --json state --jq '.[0].state // empty')
          if [ -n "${state}" ] && [ "${state}" != OPEN ]; then
            echo "::notice::The pin PR was already closed; leaving that decision in place"
            exit 0
          fi
          if [ -z "${state}" ]; then
            gh pr create --base main --head "${branch}" \
              --title "chore: pin ${slug} to FTW ${TAG}" \
              --body "Verified against ftw-native-release.json and the .sha256 files of ${TAG}. This pin merges automatically after the release receipt and all Check jobs pass. The merge makes the update available in Home Assistant."
          fi
          echo "number=$(gh pr view "${branch}" --json number --jq .number)" >> "$GITHUB_OUTPUT"
      - name: Check and publish the pin
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: python -m scripts.native_publish "$PR"
