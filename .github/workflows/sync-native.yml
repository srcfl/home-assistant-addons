name: Pin new FTW 0.x release (ftw-0x-beta, ftw-0x)

# Opens one pull request per FTW 0.x release after verifying
# ftw-native-release.json and the .sha256 files. A beta moves ftw-0x-beta. A
# stable moves the stable app ftw-0x, and ftw-0x-beta too when it outranks
# the beta pin, as Core's beta channel takes the highest release. The first
# stable pin lists ftw-0x in the store.
# Before the merge, one job per architecture builds the pin's Dockerfile from
# the checksummed release package, smoke-tests it, pushes it to a tag that
# does not exist yet and signs it (keyless Cosign, as this workflow on main).
# The pin merges only after Check passes on its exact commit and both images
# are public, signed and built from that commit's recipe. The merge is what
# shows users the new version. It creates no git tag or release.
# The retired 3.x ftw / ftw-beta apps and their workflows are untouched.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact v0.X.Y-beta.N or v0.X.Y, empty for the newest release"
        required: false
        type: string
  repository_dispatch:
    types: [ftw-native-release]

permissions:
  contents: read

concurrency:
  group: ftw-native-pin
  cancel-in-progress: false

jobs:
  pin:
    if: github.repository == 'srcfl/home-assistant-addons'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.prepare.outputs.head }}
      version: ${{ steps.prepare.outputs.version }}
      recipe: ${{ steps.prepare.outputs.recipe }}
      directory: ${{ steps.prepare.outputs.directory }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify and move the pin
        id: pin
        env:
          INPUT_TAG: ${{ inputs.tag || github.event.client_payload.tag || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(python -c 'from scripts import native_pin; print(native_pin.latest_tag())')}"
          if ! [[ "${tag}" =~ ^v0\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::not a 0.x beta or stable tag"; exit 1
          fi
          python scripts/native_pin.py bump "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # The apps this release moved, for the PR title.
          moved=""
          for app in ftw-0x ftw-0x-beta; do
            if [ -n "$(git status --porcelain -- "${app}")" ]; then moved="${moved:+${moved} and }${app}"; fi
          done
          echo "apps=${moved}" >> "$GITHUB_OUTPUT"
          if [ -z "${moved}" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open the pin pull request
        id: pr
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          APPS: ${{ steps.pin.outputs.apps }}
        run: |
          set -euo pipefail
          # One branch per release; native_publish.py reads the tag back from it.
          if [[ "${TAG}" =~ -beta\.[0-9]+$ ]]; then branch="bot/pin-ftw-0x-beta-${TAG}"; else branch="bot/pin-ftw-0x-${TAG}"; fi
          # Recover if a previous run pushed the branch but failed to open its PR.
          if ! git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "${branch}"
            # The stable app's first pin adds config.yaml and removes unlisted.yaml.
            git add -A -- ftw-0x-beta ftw-0x
            git commit -m "chore: pin ${APPS} to FTW ${TAG}"
            git push origin "${branch}"
          fi
          state=$(gh pr list --head "${branch}" --state all --json state --jq '.[0].state // empty')
          if [ -n "${state}" ] && [ "${state}" != OPEN ]; then
            echo "::notice::The pin PR was already closed; leaving that decision in place"
            exit 0
          fi
          if [ -z "${state}" ]; then
            gh pr create --base main --head "${branch}" \
              --title "chore: pin ${APPS} to FTW ${TAG}" \
              --body "Verified against ftw-native-release.json and the .sha256 files of ${TAG}. This pin merges automatically once its signed images are pushed and the release receipt and all Check jobs pass. The merge makes the update available in Home Assistant."
          fi
          echo "number=$(gh pr view "${branch}" --json number --jq .number)" >> "$GITHUB_OUTPUT"
      # Nothing is built from the branch until trusted code has recreated its diff.
      - name: Verify the pin and name its image
        id: prepare
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: python -m scripts.native_publish prepare "$PR" >> "$GITHUB_OUTPUT"

  image:
    name: Build, push and sign ${{ matrix.arch }}
    needs: pin
    if: needs.pin.outputs.number != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless Cosign signature
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      HEAD: ${{ needs.pin.outputs.head }}
      VERSION: ${{ needs.pin.outputs.version }}
      RECIPE: ${{ needs.pin.outputs.recipe }}
      APP_DIR: ${{ needs.pin.outputs.directory }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.pin.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A rerun keeps an image an earlier run pushed; publish verifies it.
      - name: Look for this version's image
        id: found
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD}"
          test "$(python -m scripts.native_image recipe "${APP_DIR}")" = "${RECIPE}"
          python -m scripts.native_image state "${ARCH}" "${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build from the pinned release package
        if: steps.found.outputs.digest == ''
        run: |
          set -euo pipefail
          docker build --pull --provenance=false \
            --build-arg "BUILD_ARCH=${ARCH}" \
            --build-arg "BUILD_VERSION=${VERSION}" \
            --label "com.sourceful.ftw.recipe=${RECIPE}" \
            --label "org.opencontainers.image.revision=${HEAD}" \
            --tag "$(python -m scripts.native_image ref "${ARCH}" "${VERSION}")" \
            "${APP_DIR}"
      - name: Smoke the image under Supervisor-like conditions
        if: steps.found.outputs.digest == ''
        run: scripts/smoke_native.sh "$(python -m scripts.native_image ref "${ARCH}" "${VERSION}")"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.found.outputs.digest == ''
      - name: Push to a new tag and sign the pushed digest
        if: steps.found.outputs.digest == ''
        run: python -m scripts.native_image push "${ARCH}" "${VERSION}"

  publish:
    name: Check and publish the pin
    needs: [pin, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No registry login here: an image that needs one cannot reach users.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check, verify the images and merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.pin.outputs.number }}
        run: python -m scripts.native_publish publish "$PR"
