name: Sync upstream FTW

on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [ftw-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftw-upstream-sync
  cancel-in-progress: false

env:
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  sync:
    name: Pin the latest upstream release
    if: github.repository == 'srcfl/home-assistant-addons'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: sync
        name: Resolve and apply upstream pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/upstream_sync.py sync
          --repository "${GITHUB_REPOSITORY}"
          --pr-body "${RUNNER_TEMP}/pr-body.md"
      - name: Validate the updated repository
        if: steps.sync.outputs.changed == 'true'
        run: python scripts/validate.py --channel beta
      - name: Run repository unit tests
        if: steps.sync.outputs.changed == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - id: pr
        name: Open or update the pin PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          TITLE: ${{ steps.sync.outputs.pr_title }}
        run: |
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"
          git checkout -B "${BRANCH}"
          git add compatibility.yaml ftw/config.yaml ftw/CHANGELOG.md pilot
          git commit --signoff -m "${TITLE}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if ! gh pr view "${BRANCH}" --json url --jq .url >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
          echo "number=$(gh pr view "${BRANCH}" --json number --jq .number)" >>"${GITHUB_OUTPUT}"
          echo "url=$(gh pr view "${BRANCH}" --json url --jq .url)" >>"${GITHUB_OUTPUT}"
      - id: checks
        name: Run checks on the PR branch
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse HEAD^)"
          gh workflow run check.yml --ref "${BRANCH}"
          run_id=""
          for _ in $(seq 1 24); do
            sleep 5
            run_id="$(gh run list --workflow=check.yml --branch "${BRANCH}" \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"${head_sha}\")][0].databaseId // empty")"
            [ -n "${run_id}" ] && break
          done
          test -n "${run_id}"
          echo "run_id=${run_id}" >>"${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >>"${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >>"${GITHUB_OUTPUT}"
      - name: Merge when checks pass
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ steps.checks.outputs.run_id }}
          HEAD_SHA: ${{ steps.checks.outputs.head_sha }}
          BASE_SHA: ${{ steps.checks.outputs.base_sha }}
        run: |
          gh run watch "${RUN_ID}" --exit-status
          test "$(gh pr view "${PR}" --json headRefOid --jq .headRefOid)" = "${HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "${BASE_SHA}"
          gh pr merge "${PR}" --squash --delete-branch --match-head-commit "${HEAD_SHA}"
      - name: Trigger beta publication
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-publish-beta.yml --ref main
