name: FTW (0.x beta)
version: "0.157.2-beta.1"
slug: ftw-0x-beta
description: New FTW 0.x beta, built on the device from the checksummed release package.
url: https://github.com/srcfl/home-assistant-addons/tree/main/ftw-0x-beta
arch:
  - amd64
  - aarch64
host_network: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: FTW web interface and API
webui: http://[HOST]:[PORT:8080]/
backup: cold
timeout: 60
environment:
  FTW_SELFUPDATE_ENABLED: "0"
  FTW_BUNDLE: home_assistant_addon
  FTW_BUNDLE_VERSION: "0.157.2-beta.1"
  FTW_IMAGE_TAG: v0.157.2-beta.1
# No `image:` key on purpose. Supervisor builds this Dockerfile on the device,
# so nothing is pushed to a registry and merging to main is the only way a new
# pin reaches users.
