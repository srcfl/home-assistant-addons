name: FTW (0.x beta)
version: "0.154.2-beta.1.ha.1"
slug: ftw-0x-beta
description: New FTW 0.x beta, built on the device from the checksummed release package.
url: https://github.com/srcfl/home-assistant-addons/tree/main/ftw-0x-beta
arch:
  - amd64
  - aarch64
host_network: true
ingress: true
ingress_port: 18099
# Supervisor defaults panel_admin to true. Keep FTW restricted to HA admins.
panel_icon: mdi:lightning-bolt
homeassistant: "2026.10.2"
backup: cold
timeout: 60
environment:
  FTW_HA_INGRESS: "1"
  FTW_SELFUPDATE_ENABLED: "0"
  FTW_BUNDLE: home_assistant_addon
  FTW_BUNDLE_VERSION: "0.154.2-beta.1.ha.1"
  FTW_IMAGE_TAG: v0.154.2-beta.1
# No `image:` key on purpose. Supervisor builds this Dockerfile on the device,
# so nothing is pushed to a registry and merging to main is the only way a new
# pin reaches users.
