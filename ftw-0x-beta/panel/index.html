<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTW</title>
<!--
  Home Assistant's sidebar panel for FTW. FTW refuses to be framed
  (frame-ancestors 'none'), so this page does not embed it: it opens FTW
  directly on the home network, port 8080, in a new tab.
-->
<style>
  :root { --bg: #fafafa; --fg: #212121; --muted: #616161; --card: #fff; --accent: #03a9f4; --warn: #b26a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #e1e1e1; --muted: #9e9e9e; --card: #1c1c1c; --accent: #03a9f4; --warn: #ffb74d; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Roboto, system-ui, sans-serif; }
  main { max-width: 32rem; margin: 15vh auto 0; padding: 0 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 500; }
  p { margin: 0 0 16px; color: var(--muted); }
  a.button { display: inline-block; padding: 10px 20px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 500; }
  code { word-break: break-all; }
  #remote { color: var(--warn); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>FTW</h1>
    <p id="intro">FTW opens in a new tab, directly on your home network.</p>
    <p><a class="button" id="open" href="http://homeassistant.local:8080/" target="_blank" rel="noopener">Open FTW</a></p>
    <p><code id="address">http://homeassistant.local:8080/</code></p>
    <p id="remote" hidden>This address is not on your home network, so FTW will not open from here. Open Home Assistant by its local address, or pair the FTW app for remote access.</p>
  </div>
</main>
<script>
  (function () {
    var text = {
      sv: {
        intro: "FTW öppnas i en ny flik, direkt på ditt hemnätverk.",
        open: "Öppna FTW",
        remote: "Adressen är inte på ditt hemnätverk, så FTW öppnas inte härifrån. Öppna Home Assistant via den lokala adressen, eller parkoppla FTW-appen för fjärråtkomst."
      }
    };
    var lang = (navigator.language || "").slice(0, 2);
    if (text[lang]) {
      document.documentElement.lang = lang;
      Object.keys(text[lang]).forEach(function (id) { document.getElementById(id).textContent = text[lang][id]; });
    }

    // The ingress frame shares Home Assistant's origin, so the top window
    // tells us the address the person used to reach Home Assistant.
    var host;
    try { host = window.top.location.hostname; } catch (e) { host = window.location.hostname; }
    if (!host) return;
    var url = "http://" + host + ":8080/";
    document.getElementById("open").href = url;
    document.getElementById("address").textContent = url;

    // Same locality rule as FTW: a private or loopback IP, localhost, or a
    // .local/.localhost/.home.arpa name. Anything else is refused by FTW.
    var name = host.toLowerCase().replace(/^\[|\]$/g, "");
    var local = name === "localhost" || /\.(local|localhost|home\.arpa)$/.test(name) ||
      /^(10\.|127\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.)/.test(name) ||
      name === "::1" || /^(f[cd]|fe80:)[0-9a-f]*:/.test(name);
    document.getElementById("remote").hidden = local;
  })();
</script>
</body>
</html>
