name: FTW (beta)
version: "3.4.2-beta.4"
slug: ftw-beta
description: Local-first home energy control from Sourceful, beta channel
url: https://github.com/srcfl/home-assistant-addons/tree/main/ftw-beta
arch:
  - amd64
  - aarch64
stage: experimental
host_network: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: FTW web interface and API
webui: http://[HOST]:[PORT:8080]/
backup: cold
timeout: 60
environment:
  FTW_SELFUPDATE_ENABLED: "0"
  FTW_BUNDLE: home_assistant_addon
  FTW_BUNDLE_VERSION: "3.4.2-beta.4"
  FTW_IMAGE_TAG: v3.4.2-beta.4
image: ghcr.io/srcfl/home-assistant-addons/ftw
